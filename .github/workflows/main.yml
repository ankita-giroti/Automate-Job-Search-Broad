name: Weekly Job Alert Email

on:
  schedule:
  # runs at 10, only on Sunday
  # - cron: "0 10 * * 0"

# allow to manually run workflow - GitHub Action
  workflow_dispatch:

jobs:
  send-job-alerts:
    runs-on: ubuntu-latest

  # - name: Install Chrome
  #   run: |
  #     sudo apt-get update
  #     sudo apt-get install -y google-chrome-stable

# createand and updated "seen_products.json" file to save seen jobs, and not adding it to new emails
    # permissions:
    #   contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r job_scraper/requirements.txt

        # Run the eamil services:
      - name: Decode .env file
        run: | 
          echo "${{ secrets.WEBSITE_CREDENTIALS }}" | base64 --decode > .env

        
      - name: Run Scrapper Service
        run: python job_scraper/process.py --run-once
      
      - name: Run CSV Clean Service
        run: python job_scraper/csv_job.py --run-once
        
      - name: Run Job Alert Service
        run: python job_scraper/job_alert.py --run-once

        # commit updated seen jobs alert to remove duplication - will do later
