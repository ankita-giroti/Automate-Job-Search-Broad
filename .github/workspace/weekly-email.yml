name: Weekly Job Alert Email

on:
  schedule:
  # runs at 10, only on Sunday
    - cron: "0 10 * * 0"

# allow to manually run workflow - GitHub Action
  workflow_dispatch:

jobs:
  send-job-alerts:
    runs-on: ubuntu-latest

# createand and updated "seen_products.json" file to save seen jobs, and not adding it to new emails
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements

      # Run the eamil services:
      - name: Run Job Alert Service
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
        run: python job_alert.py --run-once

      # commit updated seen jobs alert to remove duplication - will do later
